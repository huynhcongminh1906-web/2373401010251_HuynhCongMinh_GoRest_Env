name: API Test - Newman CSV

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  api-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Newman
        run: npm install --global newman

      - name: Run API tests with CSV
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
        run: |
          test -n "$GOREST_TOKEN" || (echo "Missing GOREST_TOKEN secret" && exit 1)
          newman run "2373401010251_HuynhCongMinh_GoRest.postman_collection.json" \
            -e "2373401010251_HuynhCongMinh_GoRest_Env.postman_environment.json" \
            -d users.csv \
            --env-var "token=$GOREST_TOKEN" \
            --env-var "baseUrl=https://gorest.co.in/public/v2" \
            --reporters cli
